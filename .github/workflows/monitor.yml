name: FX Insights daily run

on:
  schedule:
    # Runs at 08:15 UTC = 14:00 NPT, once per trading day.
    # Nepal has no DST, so this stays at 2pm NPT all year - no summer/winter
    # switch is needed (the old 22:15 UTC slot did need one).
    # Tue-Sat, not Mon-Fri: at 2pm NPT the most recent completed session is the
    # PREVIOUS day's, so Tuesday reports Monday and Saturday reports Friday.
    # Running Monday would re-fetch Friday and append a duplicate row.
    - cron: "15 8 * * 2-6"
  workflow_dispatch: {}        # lets you trigger manually from the Actions tab

concurrency:
  group: fx-insights
  cancel-in-progress: false    # never interrupt a run mid-way

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache the Excel file between runs so history accumulates
      - name: Restore Excel workbook
        uses: actions/cache@v4
        with:
          path: Forex_Insights.xlsx
          key: forex-insights-xlsx-${{ github.run_id }}
          restore-keys: |
            forex-insights-xlsx-

      - name: Run market data script
        env:
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID:       ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python main_script.py
        
