name: FX Insights daily run

on:
  # No schedule. Saphin runs this manually from the Actions tab (or with
  # `gh workflow run`) when the daily report is about to go out, which is the
  # only moment the data is needed. Removed 2026-09-17: the 08:15 UTC slot was
  # queueing badly on GitHub's free runners - one run landed 5h13m late and the
  # next never fired at all.
  #
  # NOTE: the script only ever fetches the LAST COMPLETED SESSION, so a day
  # nobody triggers it is a permanent hole in the workbook. This is how
  # 3 Jul - 1 Sep 2026 was lost.
  workflow_dispatch: {}

concurrency:
  group: fx-insights
  cancel-in-progress: false    # never interrupt a run mid-way

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache the Excel file between runs so history accumulates
      - name: Restore Excel workbook
        uses: actions/cache@v4
        with:
          path: Forex_Insights.xlsx
          key: forex-insights-xlsx-${{ github.run_id }}
          restore-keys: |
            forex-insights-xlsx-

      - name: Run market data script
        env:
          SLACK_WEBHOOK_URL:            ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID:       ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python main_script.py
        
